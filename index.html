
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F5F0">
<title>Pagamento via Pix</title>

<style>
:root {
  --cor: #B7A486;
  --fundo: #F7F5F0;
  --texto: #38352F;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--fundo);
  font-family: Arial, sans-serif;
  color: var(--texto);
}

.pagina {
  width: min(100%, 430px);
  min-height: 760px;
  aspect-ratio: 9 / 16;
  background: white;
  border-radius: 26px;
  padding: 40px 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 8px 35px rgba(0,0,0,.04);
}

.logo-pix {
  width: 88px;
  height: auto;
  margin-bottom: 30px;
}

.etiqueta {
  color: var(--cor);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

h1 {
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: 34px;
  line-height: 1.2;
  margin: 0 0 18px;
  overflow-wrap: anywhere;
}

.descricao {
  color: #85817A;
  font-size: 15px;
  line-height: 1.8;
  margin: 0 0 35px;
}

.bloco {
  width: 100%;
  padding: 23px 20px;
  border: 1px solid #EAE7E0;
  border-radius: 18px;
  background: #FCFBF8;
  margin-bottom: 16px;
  text-align: left;
}

.rotulo {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;
  color: #928A7E;
  margin-bottom: 12px;
}

.valor {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.botao {
  width: 100%;
  padding: 22px 12px;
  border: none;
  border-radius: 16px;
  background: var(--cor);
  color: white;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

.botao:active {
  opacity: .8;
}

#mensagem {
  min-height: 25px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--cor);
}

.rodape {
  margin-top: auto;
  padding-top: 35px;
  font-size: 11px;
  color: #AAA49A;
}

.rodape strong {
  display: block;
  color: var(--cor);
  margin-top: 5px;
  font-size: 12px;
}

@media(max-width:380px) {
  .pagina {
    padding: 30px 20px 20px;
  }

  h1 {
    font-size: 29px;
  }
}
</style>
</head>

<body>

<main class="pagina">

  <!-- ÍCONE PIX -->
  <img
    class="logo-pix"
    src="https://upload.wikimedia.org/wikipedia/commons/5/50/Pix_%28Brazil%29_logo.svg"
    alt="Pix"
  >

  <div class="etiqueta">PAGAMENTO VIA PIX</div>

  <h1 id="noivos"></h1>

  <p class="descricao">
    Utilize o botão abaixo para copiar a chave Pix
    e realizar seu pagamento.
  </p>

  <section class="bloco">
    <div class="rotulo">NOME DO RECEBEDOR</div>
    <div class="valor" id="recebedor"></div>
  </section>

  <button class="botao" id="copiar">
    COPIAR CHAVE PIX
  </button>

  <div id="mensagem" aria-live="polite"></div>

  <footer class="rodape">
    Desenvolvido por
    <strong>@studio.convites</strong>
  </footer>

</main>

<script>

// =====================================
// 🟨 PERSONALIZE PARA CADA CASAL
// =====================================

// 🟨 NOME DOS NOIVOS
const NOME_DOS_NOIVOS = "Fabiana e Rodrigo";

// 🟨 NOME DO RECEBEDOR
const NOME_DO_RECEBEDOR = "Fabiana Maria Silva";

// 🟨 CHAVE PIX
const CHAVE_PIX = "thainaa883@gmail.com";

// 🟨 COR PRINCIPAL
const COR_PRINCIPAL = "#808000";

// =====================================
// NÃO ALTERAR ABAIXO
// =====================================

document.documentElement.style.setProperty(
  "--cor",
  /^#[0-9A-Fa-f]{6}$/.test(COR_PRINCIPAL)
    ? COR_PRINCIPAL
    : "#B7A486"
);

document.getElementById("noivos").textContent =
  NOME_DOS_NOIVOS;

document.getElementById("recebedor").textContent =
  NOME_DO_RECEBEDOR;

document.getElementById("copiar").addEventListener(
  "click", async () => {

    const mensagem = document.getElementById("mensagem");

    if (
      !CHAVE_PIX ||
      CHAVE_PIX === "COLOQUE_A_CHAVE_PIX_AQUI"
    ) {
      mensagem.textContent = "Cadastre a chave Pix.";
      return;
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(CHAVE_PIX);
      } else {
        const campo = document.createElement("textarea");
        campo.value = CHAVE_PIX;
        campo.style.position = "fixed";
        campo.style.left = "-9999px";
        document.body.appendChild(campo);
        campo.select();

        const sucesso = document.execCommand("copy");
        campo.remove();

        if (!sucesso) throw new Error("Falha ao copiar");
      }

      mensagem.textContent =
        "Chave Pix copiada com sucesso!";

    } catch (erro) {
      mensagem.textContent =
        "Não foi possível copiar a chave.";
    }
  }
);

</script>

</body>
</html>
